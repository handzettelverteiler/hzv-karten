<style>
*{box-sizing:border-box} html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;color:#222}
#map{position:absolute;inset:0}
.panel{position:absolute;z-index:1000;top:10px;left:10px;width:310px;max-height:calc(100% - 20px);overflow:auto;background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.25);padding:14px}
.panel h1{font-size:16px;margin:0 0 4px} .panel .sub{font-size:12px;color:#666;margin-bottom:10px;line-height:1.4}
.rule{background:#FFF4D6;border-left:4px solid #E0A800;padding:8px 10px;font-size:12.5px;line-height:1.45;margin-bottom:10px;border-radius:4px}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid #eee;cursor:pointer;border-radius:6px}
.item:hover{background:#f6f6f6}
.num{flex:0 0 28px;height:28px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.item b{font-size:13.5px} .item .meta{font-size:11.5px;color:#666;margin-top:2px}
.toggle{display:none}
.btn{position:absolute;z-index:1000;right:12px;bottom:28px;background:#C81E1E;color:#fff;border:0;border-radius:24px;padding:12px 16px;font:700 14px Arial;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer}
.glabel{background:none;border:0;box-shadow:none}
.glabel div{width:34px;height:34px;border-radius:50%;color:#fff;font:700 17px Arial;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.leaflet-popup-content{font-size:13px;line-height:1.45}
.leaflet-popup-content a{display:inline-block;margin-top:6px;background:#12463C;color:#fff;padding:6px 10px;border-radius:5px;text-decoration:none;font-weight:700}
@media (max-width:760px){
 .panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:45%;border-radius:12px 12px 0 0;padding:10px 12px}
 .panel.min .list,.panel.min .rule,.panel.min .sub{display:none}
 .toggle{display:block;float:right;border:1px solid #ccc;background:#fff;border-radius:14px;padding:3px 10px;font-size:12px}

}
